<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giải Mã Câu Chúc - Dành Cho Giang 💌</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: #4a4a4a;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }

        .fade-element {
            opacity: 1;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            transform: translateY(0);
            width: 100%;
        }

        .fade-element.hidden {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }

        h1, h2, p {
            margin-bottom: 20px;
            line-height: 1.5;
        }

        h2 {
            font-size: 1.4rem;
            color: #ff6b6b;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            color: #555;
            font-weight: 600;
        }

        .gift-box {
            font-size: 80px;
            cursor: pointer;
            animation: bounce 2s infinite;
            margin: 20px 0;
            display: inline-block;
            transition: transform 0.3s;
        }

        .gift-box:active {
            transform: scale(0.9);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-7px);}
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            width: 100%;
        }

        input[type="text"], input[type="number"] {
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            outline: none;
            width: 60%;
            text-align: center;
            background: #fff;
            color: #333;
            font-weight: 600;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #ff6b6b;
        }

        .date-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
            width: 100%;
        }

        .date-group input {
            width: 30%;
        }

        button.btn-action {
            padding: 12px 20px;
            font-size: 1rem;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: background 0.3s, transform 0.2s;
        }

        button.btn-action:active {
            transform: scale(0.95);
            background: #ff5252;
        }

        .color-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .color-btn {
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s, opacity 0.3s;
        }

        .color-btn:active {
            transform: scale(0.97);
        }

        .color-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .timer-text {
            font-size: 0.9rem;
            color: #ff6b6b;
            margin-top: 10px;
            font-weight: 700;
        }

        /* Hiệu ứng mưa icon phần cuối */
        .falling-icon {
            position: fixed;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <!-- Nội dung sẽ được render linh hoạt bằng JavaScript -->
    </div>

    <script>
        // Danh sách các màu cơ bản mặc định phòng hờ file txt chưa tải kịp
        let defaultColors = ["Đỏ", "Xanh dương", "Trắng", "Đen", "Vàng"];
        let quanColors = [...defaultColors];
        let aoColors = [...defaultColors];

        // Lấy dữ liệu màu từ các file bên ngoài (nếu có trên GitHub)
        async function loadExternalData() {
            try {
                const resQuan = await fetch('MauQuanCuaThanh.txt');
                if (resQuan.ok) {
                    let text = await resQuan.text();
                    let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    if (lines.length > 0) quanColors = lines;
                }
            } catch (e) { console.log('Dùng màu mặc định cho Quần'); }

            try {
                const resAo = await fetch('MauAoCuaThu.txt');
                if (resAo.ok) {
                    let text = await resAo.text();
                    let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    if (lines.length > 0) aoColors = lines;
                }
            } catch (e) { console.log('Dùng màu mặc định cho Áo'); }
        }
        loadExternalData();

        // Quản lý tiến trình bằng localStorage
        let currentStep = parseInt(localStorage.getItem('giang_quiz_step')) || 1;

        const container = document.getElementById('app-container');

        function saveProgress(step) {
            currentStep = step;
            localStorage.setItem('giang_quiz_step', step);
        }

        function renderStep() {
            container.innerHTML = '';
            switch (currentStep) {
                case 1: renderStep1(); break;
                case 2: renderStep2(); break;
                case 3: renderStep3(); break;
                case 4: renderStep4(); break;
                case 5: renderStep5(); break;
                case 6: renderStep6(); break;
                case 7: renderStep7(); break;
                case 8: renderStep8(); break;
                case 9: renderStep9(); break;
                case 10: renderStep10(); break;
                case 11: renderStep11(); break;
                case 12: renderStepFinal(); break;
                default: saveProgress(1); renderStep1();
            }
        }

        function fadeInOut(htmlContent, callback, showDelay = 0) {
            container.innerHTML = `<div class="fade-element hidden">${htmlContent}</div>`;
            const el = container.querySelector('.fade-element');
            
            setTimeout(() => {
                el.classList.remove('hidden');
            }, 100);

            if (callback) {
                callback(el);
            }
        }

        // --- BƯỚC 1 ---
        function renderStep1() {
            container.innerHTML = `<div class="fade-element hidden"><h2>Nếu là Giang thì hãy mở thiệp 💌</h2><div class="gift-box" id="giftBtn">🎁</div></div>`;
            const el = container.querySelector('.fade-element');
            setTimeout(() => el.classList.remove('hidden'), 100);

            const giftBtn = document.getElementById('giftBtn');
            giftBtn.style.display = 'none';

            // Sau 5s hiện thiệp ra
            setTimeout(() => {
                giftBtn.style.display = 'inline-block';
            }, 5000);

            giftBtn.onclick = () => {
                el.classList.add('hidden');
                setTimeout(() => {
                    saveProgress(2);
                    renderStep();
                }, 800);
            };
        }

        // --- BƯỚC 2 ---
        function renderStep2() {
            let html = `
                <h2>Muốn Đăng chúc không phải dễ đâu nha😂</h2>
                <p>Con hạc bị cụt đuôi.</p>
                <div class="input-group">
                    <input type="number" id="codeInp" placeholder="Mã 4 số">
                    <button class="btn-action" id="okBtn">OK</button>
                </div>
            `;
            fadeInOut(html, (el) => {
                document.getElementById('okBtn').onclick = () => {
                    let val = document.getElementById('codeInp').value.trim();
                    if (val === '1110') {
                        el.classList.add('hidden');
                        setTimeout(() => {
                            container.innerHTML = `<div class="fade-element hidden"><h2>Khá đó😊</h2></div>`;
                            container.querySelector('.fade-element').classList.remove('hidden');
                            setTimeout(() => {
                                container.querySelector('.fade-element').classList.add('hidden');
                                setTimeout(() => {
                                    saveProgress(3);
                                    renderStep();
                                }, 800);
                            }, 3000);
                        }, 800);
                    } else {
                        alert('Sai mã rồi Giang ơi! Thử lại nha 😆');
                    }
                };
            });
        }

        // --- BƯỚC 3 ---
        function renderStep3() {
            let html = `
                <p>Con hạc fan Ronaldo⚽</p>
                <div class="input-group">
                    <input type="number" id="codeInp" placeholder="Mã 4 số">
                    <button class="btn-action" id="okBtn">OK</button>
                </div>
            `;
            fadeInOut(html, (el) => {
                document.getElementById('okBtn').onclick = () => {
                    let val = document.getElementById('codeInp').value.trim();
                    if (val === '7777') {
                        el.classList.add('hidden');
                        setTimeout(() => {
                            container.innerHTML = `<div class="fade-element hidden"><p>Tốt lắm, đây mới chỉ là khởi đầu thôi😏</p></div>`;
                            container.querySelector('.fade-element').classList.remove('hidden');
                            setTimeout(() => {
                                container.querySelector('.fade-element').classList.add('hidden');
                                setTimeout(() => {
                                    saveProgress(4);
                                    renderStep();
                                }, 800);
                            }, 5000);
                        }, 800);
                    } else {
                        alert('Sai mất tiêu rồi!');
                    }
                };
            });
        }

        // --- BƯỚC 4 ---
        function renderStep4() {
            let html = `
                <p>Con hạc có eye</p>
                <div class="input-group">
                    <input type="text" id="codeInp" placeholder="Nhập mã">
                    <button class="btn-action" id="okBtn">OK</button>
                </div>
            `;
            fadeInOut(html, (el) => {
                document.getElementById('okBtn').onclick = () => {
                    let val = document.getElementById('codeInp').value.trim().toLowerCase();
                    if (val === '4052') {
                        el.classList.add('hidden');
                        setTimeout(() => {
                            container.innerHTML = `<div class="fade-element hidden"><p>Bắt đầu hay rồi nè 😆</p></div>`;
                            container.querySelector('.fade-element').classList.remove('hidden');
                            setTimeout(() => {
                                container.querySelector('.fade-element').classList.add('hidden');
                                setTimeout(() => {
                                    saveProgress(5);
                                    renderStep();
                                }, 800);
                            }, 4000);
                        }, 800);
                    } else {
                        alert('Chưa chính xác nha!');
                    }
                };
            });
        }

        // --- BƯỚC 5 ---
        function renderStep5() {
            let html = `
                <p>Con hạc cụt một cánh😥</p>
                <div class="input-group">
                    <input type="number" id="codeInp" placeholder="Mã 4 số">
                    <button class="btn-action" id="okBtn">OK</button>
                </div>
            `;
            fadeInOut(html, (el) => {
                document.getElementById('okBtn').onclick = () => {
                    let val = document.getElementById('codeInp').value.trim();
                    if (val === '7259') {
                        el.classList.add('hidden');
                        setTimeout(() => {
                            container.innerHTML = `<div class="fade-element hidden"><p>Hehe..😏</p></div>`;
                            container.querySelector('.fade-element').classList.remove('hidden');
                            setTimeout(() => {
                                container.querySelector('.fade-element').classList.add('hidden');
                                setTimeout(() => {
                                    saveProgress(6);
                                    renderStep();
                                }, 800);
                            }, 3000);
                        }, 800);
                    } else {
                        alert('Thử lại xem nào!');
                    }
                };
            });
        }

        // --- BƯỚC 6 ---
        function renderStep6() {
            let html = `
                <p>Con hạc của 🌞</p>
                <div class="input-group">
                    <input type="number" id="codeInp" placeholder="Mã 4 số">
                    <button class="btn-action" id="okBtn">OK</button>
                </div>
            `;
            fadeInOut(html, (el) => {
                document.getElementById('okBtn').onclick = () => {
                    let val = document.getElementById('codeInp').value.trim();
                    if (val === '2561') {
                        el.classList.add('hidden');
                        setTimeout(() => {
                            container.innerHTML = `<div class="fade-element hidden"><p>Quá là đơn giản 😮</p></div>`;
                            container.querySelector('.fade-element').classList.remove('hidden');
                            setTimeout(() => {
                                container.querySelector('.fade-element').classList.add('hidden');
                                setTimeout(() => {
                                    saveProgress(7);
                                    renderStep();
                                }, 800);
                            }, 5000);
                        }, 800);
                    } else {
                        alert('Không đúng rồi!');
                    }
                };
            });
        }

        // --- BƯỚC 7 ---
        function renderStep7() {
            let html = `
                <p>Con hạc bị tật đuôi</p>
                <div class="input-group">
                    <input type="number" id="codeInp" placeholder="Mã 4 số">
                    <button class="btn-action" id="okBtn">OK</button>
                </div>
            `;
            fadeInOut(html, (el) => {
                document.getElementById('okBtn').onclick = () => {
                    let val = document.getElementById('codeInp').value.trim();
                    if (val === '2009') {
                        el.classList.add('hidden');
                        setTimeout(() => {
                            renderColorGame(quanColors, "Quần của Thành cũng đặc biệt phết 🤣", 8);
                        }, 800);
                    } else {
                        alert('Sai mã 4 số rồi!');
                    }
                };
            });
        }

        // --- BƯỚC 8 ---
        function renderStep8() {
            let html = `
                <p>Con hạc 💕</p>
                <div class="input-group">
                    <input type="number" id="codeInp" placeholder="Mã 4 số">
                    <button class="btn-action" id="okBtn">OK</button>
                </div>
            `;
            fadeInOut(html, (el) => {
                document.getElementById('okBtn').onclick = () => {
                    let val = document.getElementById('codeInp').value.trim();
                    if (val === '3213') {
                        el.classList.add('hidden');
                        setTimeout(() => {
                            container.innerHTML = `<div class="fade-element hidden"><p>Chúc vui vẻ nha😊</p></div>`;
                            container.querySelector('.fade-element').classList.remove('hidden');
                            setTimeout(() => {
                                container.querySelector('.fade-element').classList.add('hidden');
                                setTimeout(() => {
                                    saveProgress(9);
                                    renderStep();
                                }, 800);
                            }, 5000);
                        }, 800);
                    } else {
                        alert('Thử lại nhé!');
                    }
                };
            });
        }

        // --- BƯỚC 9 ---
        function renderStep9() {
            let html = `
                <p>Con hạc có khăn quàng cổ 🔴</p>
                <div class="date-group">
                    <input type="number" id="dayInp" placeholder="Ngày" min="1" max="31">
                    <input type="number" id="monthInp" placeholder="Tháng" min="1" max="12">
                    <input type="number" id="yearInp" placeholder="Năm" min="1900">
                </div>
                <div style="margin-top: 15px;">
                    <button class="btn-action" id="okBtn">OK</button>
                </div>
            `;
            fadeInOut(html, (el) => {
                document.getElementById('okBtn').onclick = () => {
                    let d = document.getElementById('dayInp').value.trim();
                    let m = document.getElementById('monthInp').value.trim();
                    let y = document.getElementById('yearInp').value.trim();
                    if (d === '21' && m === '7' && y === '2009') {
                        el.classList.add('hidden');
                        setTimeout(() => {
                            container.innerHTML = `<div class="fade-element hidden"><p style="font-size: 50px;">🎂</p></div>`;
                            container.querySelector('.fade-element').classList.remove('hidden');
                            setTimeout(() => {
                                container.querySelector('.fade-element').classList.add('hidden');
                                setTimeout(() => {
                                    saveProgress(10);
                                    renderStep();
                                }, 800);
                            }, 3000);
                        }, 800);
                    } else {
                        alert('Ngày tháng năm chưa chính xác!');
                    }
                };
            });
        }

        // --- BƯỚC 10 ---
        function renderStep10() {
            let html = `
                <p>Con hạc không có đầu😲</p>
                <div class="input-group">
                    <input type="number" id="codeInp" placeholder="Mã 4 số">
                    <button class="btn-action" id="okBtn">OK</button>
                </div>
            `;
            fadeInOut(html, (el) => {
                document.getElementById('okBtn').onclick = () => {
                    let val = document.getElementById('codeInp').value.trim();
                    if (val === '9010') {
                        el.classList.add('hidden');
                        setTimeout(() => {
                            renderColorGame(aoColors, "Con hạc cuối cùng😆", 11, 4);
                        }, 800);
                    } else {
                        alert('Sai mã rồi!');
                    }
                };
            });
        }

        // Mini Game chọn màu chung cho Bước 7 & Bước 10
        function renderColorGame(colorList, successMsg, nextStepNum, successTime = 7) {
            container.innerHTML = `
                <div class="fade-element hidden">
                    <h2>Chờ đã!, con hạc đó hỏi gì vậy?</h2>
                    <div id="gameContent" style="display:none; margin-top: 15px; width: 100%;">
                        <div class="color-grid" id="colorGrid"></div>
                        <div class="timer-text" id="timerText" style="display:none;"></div>
                    </div>
                </div>
            `;
            const el = container.querySelector('.fade-element');
            setTimeout(() => el.classList.remove('hidden'), 100);

            setTimeout(() => {
                const gameContent = document.getElementById('gameContent');
                gameContent.style.display = 'block';
                setupColors(colorList, successMsg, nextStepNum, successTime);
            }, 7000);
        }

        function setupColors(colorList, successMsg, nextStepNum, successTime) {
            const grid = document.getElementById('colorGrid');
            const timerText = document.getElementById('timerText');
            grid.innerHTML = '';

            // Chọn màu đầu tiên trong danh sách làm màu đúng (hoặc tùy chỉnh)
            let correctColor = colorList[0];
            let shuffled = [...colorList].sort(() => Math.random() - 0.5);

            shuffled.forEach(colorName => {
                let btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.innerText = colorName;
                btn.style.background = getColorHex(colorName);
                
                btn.onclick = () => {
                    if (colorName === correctColor) {
                        // Chọn đúng
                        container.querySelector('.fade-element').classList.add('hidden');
                        setTimeout(() => {
                            container.innerHTML = `<div class="fade-element hidden"><p>${successMsg}</p></div>`;
                            container.querySelector('.fade-element').classList.remove('hidden');
                            setTimeout(() => {
                                container.querySelector('.fade-element').classList.add('hidden');
                                setTimeout(() => {
                                    saveProgress(nextStepNum);
                                    renderStep();
                                }, 800);
                            }, successTime * 1000);
                        }, 800);
                    } else {
                        // Chọn sai -> khóa nút trong 10s và trộn lại
                        let allBtns = grid.querySelectorAll('button');
                        allBtns.forEach(b => b.disabled = true);
                        timerText.style.display = 'block';
                        let timeLeft = 10;
                        timerText.innerText = `Chọn sai rồi! Vui lòng đợi ${timeLeft}s để trộn lại màu...`;

                        let interval = setInterval(() => {
                            timeLeft--;
                            if (timeLeft > 0) {
                                timerText.innerText = `Chọn sai rồi! Vui lòng đợi ${timeLeft}s để trộn lại màu...`;
                            } else {
                                clearInterval(interval);
                                timerText.style.display = 'none';
                                setupColors(colorList, successMsg, nextStepNum, successTime);
                            }
                        }, 1000);
                    }
                };
                grid.appendChild(btn);
            });
        }

        function getColorHex(name) {
            let n = name.toLowerCase();
            if (n.includes('đỏ') || n.includes('red')) return '#ff6b6b';
            if (n.includes('trắng') || n.includes('white')) return '#a0a0a0';
            if (n.includes('đen') || n.includes('black')) return '#333333';
            if (n.includes('xanh') || n.includes('blue')) return '#4d96ff';
            if (n.includes('vàng') || n.includes('yellow')) return '#fbc531';
            return '#ff9f43';
        }

        // --- BƯỚC 11 ---
        function renderStep11() {
            container.innerHTML = `<div class="fade-element hidden"><p>Con hạc bình thường😎</p></div>`;
            const el = container.querySelector('.fade-element');
            setTimeout(() => el.classList.remove('hidden'), 100);

            setTimeout(() => {
                el.classList.add('hidden');
                setTimeout(() => {
                    container.innerHTML = `
                        <div class="fade-element hidden">
                            <p>Con hạc này Đăng dành tặng cho Giang😊</p>
                            <button class="btn-action" id="nextBtn" style="margin-top: 15px;">Next ➔</button>
                        </div>
                    `;
                    container.querySelector('.fade-element').classList.remove('hidden');
                    document.getElementById('nextBtn').onclick = () => {
                        container.querySelector('.fade-element').classList.add('hidden');
                        setTimeout(() => {
                            saveProgress(12);
                            renderStep();
                        }, 800);
                    };
                }, 800);
            }, 5000);
        }

        // --- BƯỚC FINAL ---
        function renderStepFinal() {
            container.innerHTML = `
                <div class="fade-element hidden">
                    <h2>HOÀN THÀNH</h2>
                </div>
            `;
            const el = container.querySelector('.fade-element');
            setTimeout(() => el.classList.remove('hidden'), 100);

            // Hiệu ứng bắn icon vui tươi lúc đầu
            triggerConfetti();

            setTimeout(() => {
                el.classList.add('hidden');
                setTimeout(() => {
                    container.innerHTML = `
                        <div class="fade-element hidden" style="font-size: 1.05rem; font-weight: 600; line-height: 1.6;">
                            <h2>Mừng Giang tốt nghiệp Giáo lý viên nha! 🎓✨</h2>
                            <p>Chúc Giang luôn giữ được nhiệt huyết, niềm vui và lan tỏa thật nhiều điều tốt đẹp đến các em thiếu nhi trên hành trình sắp tới! 💗</p>
                        </div>
                    `;
                    container.querySelector('.fade-element').classList.remove('hidden');
                    startRainIcons();
                }, 800);
            }, 5000);
        }

        function triggerConfetti() {
            for (let i = 0; i < 30; i++) {
                let div = document.createElement('div');
                div.className = 'falling-icon';
                div.innerHTML = ['✨', '🌸', '💖', '🎉', '⭐'][Math.floor(Math.random() * 5)];
                div.style.left = Math.random() * 100 + 'vw';
                div.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 3000);
            }
        }

        function startRainIcons() {
            setInterval(() => {
                let div = document.createElement('div');
                div.className = 'falling-icon';
                div.innerHTML = ['🌸', '💗', '✨', '🌿', '🕊️'][Math.floor(Math.random() * 5)];
                div.style.left = Math.random() * 100 + 'vw';
                div.style.animationDuration = (Math.random() * 4 + 3) + 's';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 7000);
            }, 400);
        }

        // Khởi chạy ứng dụng
        renderStep();
    </script>
</body>
</html>
